[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "1.0.0a1"
description = "Local AI Bug Bounty Assistant"
requires-python = ">=3.12"

dependencies = [
    "rich",
    "requests",
    "pyyaml",
    "python-dotenv"
]

[project.optional-dependencies]
# Opt-in Login Tester. The core stays lightweight and cloud-free; install
# with `pip install -e ".[login]"` then `python -m playwright install chromium`
# to drive a real browser, wait for MFA, and capture an authenticated session.
login = ["playwright>=1.40"]

[project.scripts]
sentinel = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The offline default: deselect the live tier so plain `pytest` stays fully
# hermetic (no network, no containers). Run the live wins explicitly with
# `pytest -m live` once the vulnerable targets are up (see docker-compose.yml).
addopts = "-m 'not live'"
markers = [
    "live: touches a live vulnerable target (OWASP Juice Shop / VAmPI); deselected by default, run with `-m live`",
]
