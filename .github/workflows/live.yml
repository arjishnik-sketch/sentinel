name: live

# The gated live-integration tier: stands up the intentionally-vulnerable
# targets and proves the SQL-injection wins end-to-end (VALIDATED, then
# VALIDATED->DISPROVED under the remediation shield). Kept OFF the default
# offline CI so a normal push stays hermetic — this runs on demand, on pushes to
# the long-lived branches, and on PRs into main.
on:
  workflow_dispatch:
  push:
    branches: [main, sentinel-2]
  pull_request:
    branches: [main]

jobs:
  live-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SENTINEL_JUICE_URL: http://localhost:3000
      SENTINEL_VAMPI_URL: http://localhost:5001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start vulnerable targets
        run: docker compose up -d

      - name: Wait for OWASP Juice Shop
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$SENTINEL_JUICE_URL/rest/admin/application-version" >/dev/null 2>&1; then
              echo "Juice Shop is up"; exit 0
            fi
            sleep 3
          done
          echo "Juice Shop did not come up in time"; exit 1

      - name: Wait for VAmPI
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "$SENTINEL_VAMPI_URL/" >/dev/null 2>&1; then
              echo "VAmPI is up"; exit 0
            fi
            sleep 3
          done
          echo "VAmPI did not come up in time"; exit 1

      - name: Seed VAmPI database (default users name1/name2)
        run: curl -fsS "$SENTINEL_VAMPI_URL/createdb" || true

      - name: Install Sentinel
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run the live injection suite
        run: pytest -m live -v

      - name: Dump target logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down targets
        if: always()
        run: docker compose down -v
